<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feliz cumpleaños</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/reset.css">
    <link rel="stylesheet" href="./css/variables.css">
    <link rel="stylesheet" href="./css/components.css">
    <link rel="stylesheet" href="./css/responsive.css">
</head>

<body>
    <main class="home">

        <!-- Pantalla inicial -->
        <section class="home__intro">
            <div class="home__intro-content">
                <p class="home__intro-text">
                    ¡¡¡Eyyyy!!! Espera... <br><br>
                    Hay algo que quiero mostrarte... <br><br>
                    No te vayas aún...
                    <br><br>
                    :(
                </p>
            </div>
        </section>

        <!-- Caja de la sorpresa -->
        <section class="home__surprise">
            <div class="home__surprise-content">
                <p class="home__surprise-text">
                    Veamos los detalles...
                </p>
                <button class="home__box" type="button">
                    <img src="./img/_tesoro.gif" alt="Abrir el cofre">
                </button>
            </div>
        </section>

        <!-- Celebración -->
        <section class="home__celebration">
            <div class="home__celebration-video">
                <video class="home__celebration-media" playsinline>
                    <source src="./video/party.mp4" type="video/mp4">
                    Tu navegador no puede reproducir este video.
                </video>
            </div>

        <!-- Revelación -->
        <section class="home__reveal">
            <div class="home__reveal-content">
                <p class="home__reveal-text">
                    Feliz cumpleaños
                </p>
                <h1 class="home__reveal-title">
                    Mamá
                </h1>
                <a href="./historia.html" class="button button--primary">
                    Comenzar
                </a>
            </div>
        </section>

    </main>

    <script src="./js/main.js"></script>
</body>

</html>
